<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zenith | Premium Wellness Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap');
        
        body {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* Slate 950 */
            color: #f8fafc;
        }
        
        /* Enforce tabular numerals to stop the timer from shifting horizontally */
        .font-mono-extrabold { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-variant-numeric: tabular-nums; }
        .font-mono-bold { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-variant-numeric: tabular-nums; }
        .font-mono-thin { font-family: 'JetBrains Mono', monospace; font-weight: 200; font-variant-numeric: tabular-nums; }
        .font-mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Mobile App Layout Fixes */
        .app-container {
            width: 100%;
            height: 100dvh;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            background-color: #0f172a;
            overflow: hidden;
            transition: background-color 1s ease-in-out;
        }
        
        @media (min-width: 481px) {
            .app-container {
                height: 92vh;
                border-radius: 2rem;
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 10px rgba(15, 23, 42, 0.5);
            }
        }

        /* Ambient Glow for Active Phase */
        .pulse-ring {
            animation: pulse-glow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.0); background-color: rgba(16, 185, 129, 0.02); }
            50% { box-shadow: 0 0 40px 0 rgba(16, 185, 129, 0.15); background-color: rgba(16, 185, 129, 0.08); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.0); background-color: rgba(16, 185, 129, 0.02); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(51, 65, 85, 0.8); }

        /* Hide elements gracefully for focus mode */
        .focus-hidden {
            opacity: 0;
            max-height: 0;
            pointer-events: none;
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
        }
        .transition-focus {
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-0 sm:p-4 bg-slate-950">

    <!-- Side Menu Overlay -->
    <div id="menuBackdrop" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-40 hidden opacity-0 transition-opacity duration-300" onclick="app.closeMenu()"></div>
    
    <div id="sideMenu" class="fixed inset-y-0 left-0 w-3/4 max-w-sm bg-slate-900 border-r border-slate-700/50 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="p-6 border-b border-slate-800 flex justify-between items-center">
            <h2 class="text-emerald-400 text-sm font-semibold tracking-[0.2em] uppercase">Zenith</h2>
            <button onclick="app.closeMenu()" class="text-slate-400 hover:text-white p-2 rounded-full hover:bg-slate-800 transition">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto py-4 flex flex-col gap-1" id="menuList">
            <!-- Populated dynamically via JS -->
        </div>

        <div class="p-6 border-t border-slate-800 flex space-x-3 bg-slate-900/50 backdrop-blur-sm">
            <button onclick="document.getElementById('importInput').click()" class="flex-1 text-slate-300 hover:text-white text-xs font-semibold py-3.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl transition border border-slate-700">
                IMPORT
            </button>
            <button onclick="app.exportRoutine()" class="flex-1 text-slate-300 hover:text-white text-xs font-semibold py-3.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl transition border border-slate-700">
                EXPORT
            </button>
            <input type="file" id="importInput" accept=".json" class="hidden" onchange="app.importRoutine(event)">
        </div>
    </div>

    <div class="app-container p-6 relative">
        
        <!-- Top Nav Header -->
        <header id="topNav" class="flex items-center justify-between mb-4 transition-focus">
            <button onclick="app.openMenu()" class="text-slate-400 hover:text-white transition p-2 bg-slate-800/50 rounded-full border border-slate-700/50 backdrop-blur-sm">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <h1 id="topBarTitle" class="text-xs font-semibold tracking-[0.15em] text-slate-400 uppercase truncate px-4">Routine</h1>
            <div class="w-10"></div> <!-- Spacer for centering -->
        </header>

        <!-- Timer Display Area (The Hero Section) -->
        <div id="activePhaseContainer" class="flex-shrink-0 flex flex-col items-center justify-center transition-focus duration-700 rounded-[2.5rem] py-2 mb-2 mt-1">
            
            <p id="currentPhaseLabel" class="text-slate-400 text-sm font-medium tracking-[0.15em] uppercase mb-2 h-6 flex items-center justify-center transition-colors hidden">READY</p>
            
            <!-- Big Interval Timer -->
            <div id="intervalTimeDisplay" class="text-[60px] sm:text-[80px] font-mono-extrabold text-white tracking-tighter mb-4 drop-shadow-2xl transition-all h-[120px] flex items-center justify-center hidden">0</div>
            
            <div id="nextPhaseLabelWrapper" class="h-6 mb-6 hidden">
                <p id="nextPhaseLabel" class="text-slate-400 text-xs tracking-wider uppercase bg-slate-800/60 px-4 py-1.5 rounded-full border border-slate-700/50 hidden">Up Next: --</p>
            </div>

            <!-- Total Remaining (Small Pill) -->
            <div class="flex items-center space-x-3 text-slate-400 bg-slate-900/80 px-5 py-2.5 rounded-2xl border border-slate-800 shadow-inner">
                <span class="text-[10px] font-semibold uppercase tracking-widest text-slate-500">Session</span>
                <span id="totalTimeDisplay" class="text-sm font-mono-extrabold text-slate-200">00:00</span>
            </div>
        </div>

        <!-- Scrollable Settings / Routine List -->
        <div class="flex-1 min-h-0 flex flex-col transition-focus relative z-10" id="settingsContainer">
            
            <!-- BREATHING SETTINGS -->
            <div id="breathingSettings" class="flex-1 overflow-y-auto space-y-4 animate-fade-in absolute inset-0 pb-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-800/40 p-5 rounded-3xl border border-slate-700/50 flex flex-col items-center justify-center">
                        <label class="block text-[10px] font-semibold text-slate-500 mb-2 uppercase tracking-widest">Inhale (Sec)</label>
                        <input type="number" id="int1" value="4" min="1" class="w-full bg-transparent text-4xl font-light text-white text-center outline-none">
                    </div>
                    <div class="bg-slate-800/40 p-5 rounded-3xl border border-slate-700/50 flex flex-col items-center justify-center">
                        <label class="block text-[10px] font-semibold text-slate-500 mb-2 uppercase tracking-widest">Exhale (Sec)</label>
                        <input type="number" id="int2" value="6" min="1" class="w-full bg-transparent text-4xl font-light text-white text-center outline-none">
                    </div>
                </div>
                <div class="bg-slate-800/40 p-6 rounded-3xl border border-slate-700/50">
                    <label class="block text-[10px] font-semibold text-slate-500 mb-4 uppercase tracking-widest text-center">Total Session Duration</label>
                    <div class="flex items-center justify-center space-x-3">
                        <input type="number" id="totalMin" value="5" min="0" class="w-20 bg-transparent text-4xl font-light text-right text-white outline-none">
                        <span class="text-xl text-slate-600 mb-1">m</span>
                        <span class="text-3xl text-slate-700 font-light mb-1">:</span>
                        <input type="number" id="totalSec" value="0" min="0" max="59" class="w-20 bg-transparent text-4xl font-light text-left text-white outline-none">
                        <span class="text-xl text-slate-600 mb-1">s</span>
                    </div>
                </div>
            </div>

            <!-- ROUTINE SETTINGS -->
            <div id="routineSettings" class="hidden absolute inset-0 flex flex-col pb-4">
                <div class="flex flex-col gap-3 mb-4 flex-shrink-0">
                    <input type="text" id="flowNameInput" class="text-xl text-white font-medium tracking-wide bg-transparent outline-none w-full border-b border-slate-700/50 focus:border-emerald-500 transition-colors pb-2 px-1" value="Custom Flow" oninput="app.updateFlowName(this.value)">
                    
                    <button onclick="app.addRoutineStep()" class="text-emerald-400 hover:text-white hover:bg-emerald-500/20 text-xs font-semibold px-4 py-3 bg-emerald-500/10 rounded-xl border border-emerald-500/20 transition-all flex items-center justify-center space-x-2">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                        <span class="tracking-widest uppercase">Add Step</span>
                    </button>
                </div>
                
                <div id="routineList" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Main Controls (Floating Bottom Bar style) -->
        <div class="flex space-x-3 mt-auto pt-4 pb-2 relative z-20 flex-shrink-0 transition-focus" id="controlBar">
            <button id="resetBtn" class="flex items-center justify-center bg-slate-800 hover:bg-slate-700 text-slate-300 py-4 px-6 rounded-2xl transition w-20 flex-shrink-0 border border-slate-700 shadow-sm" title="Reset Session">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
            <button id="mainActionBtn" class="flex-1 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-semibold py-4 px-6 rounded-2xl shadow-[0_8px_25px_rgba(16,185,129,0.3)] transform transition active:scale-95 text-[15px] tracking-[0.2em] uppercase flex items-center justify-center shadow-emerald-900/50">
                START SESSION
            </button>
        </div>

        <!-- Background Audio Keep-Alive -->
        <audio id="silentAudio" loop playsinline>
            <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" type="audio/wav">
        </audio>
    </div>

    <!-- Edit Modal (Hidden) -->
    <div id="editModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 transition-opacity">
        <div class="w-full max-w-sm rounded-[2rem] p-6 bg-slate-900 border border-slate-800 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-500 to-teal-400"></div>
            
            <h3 class="text-slate-200 text-lg font-medium tracking-wide mb-6">Edit Step</h3>
            
            <div class="mb-5">
                <label class="block text-[10px] text-slate-500 uppercase tracking-widest mb-2 font-semibold">Step Name</label>
                <input type="text" id="editName" class="w-full bg-slate-950 text-white border border-slate-800 rounded-xl p-3.5 outline-none focus:border-emerald-500 transition text-sm font-medium" placeholder="e.g. Kapalbhati">
            </div>
            
            <div class="mb-5">
                <label class="block text-[10px] text-slate-500 uppercase tracking-widest mb-2 font-semibold">Type</label>
                <div class="flex space-x-3 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
                    <label class="flex-1 text-center cursor-pointer relative">
                        <input type="radio" name="editType" value="action" class="peer sr-only">
                        <div class="py-2 text-xs font-semibold text-slate-400 rounded-lg peer-checked:bg-slate-800 peer-checked:text-emerald-400 transition">Action</div>
                    </label>
                    <label class="flex-1 text-center cursor-pointer relative">
                        <input type="radio" name="editType" value="break" class="peer sr-only">
                        <div class="py-2 text-xs font-semibold text-slate-400 rounded-lg peer-checked:bg-slate-800 peer-checked:text-amber-400 transition">Break</div>
                    </label>
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-[10px] text-slate-500 uppercase tracking-widest mb-2 font-semibold">Duration (Min : Sec)</label>
                <div class="flex items-center space-x-2 bg-slate-950 border border-slate-800 rounded-xl p-1">
                    <input type="number" id="editMin" class="w-full bg-transparent p-3 text-center text-white outline-none font-mono text-lg" placeholder="00">
                    <span class="text-slate-600 font-bold">:</span>
                    <input type="number" id="editSec" class="w-full bg-transparent p-3 text-center text-white outline-none font-mono text-lg" placeholder="00">
                </div>
            </div>

            <div class="flex space-x-3">
                <button onclick="app.closeEditModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-4 rounded-xl text-xs font-semibold tracking-widest uppercase transition text-slate-300">Cancel</button>
                <button onclick="app.saveEditModal()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl text-xs font-semibold tracking-widest uppercase transition text-white shadow-[0_4px_15px_rgba(16,185,129,0.3)]">Save</button>
            </div>
        </div>
    </div>

    <script>
        // --- Web Worker (Background accuracy) ---
        const workerCode = `
            let timer = null;
            self.onmessage = function(e) {
                if (e.data === 'start') {
                    if (timer) clearInterval(timer);
                    timer = setInterval(() => self.postMessage('tick'), 50);
                } else if (e.data === 'stop') {
                    clearInterval(timer);
                    timer = null;
                }
            };
        `;
        const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
        const worker = new Worker(URL.createObjectURL(workerBlob));

        // --- Audio Engine (Psychology-driven acoustics) ---
        class AcousticEngine {
            constructor() {
                this.ctx = null;
                this.keepAliveNode = null;
            }

            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                if (!this.keepAliveNode) {
                    this.keepAliveNode = this.ctx.createOscillator();
                    const keepAliveGain = this.ctx.createGain();
                    keepAliveGain.gain.value = 0.0001; 
                    this.keepAliveNode.connect(keepAliveGain);
                    keepAliveGain.connect(this.ctx.destination);
                    this.keepAliveNode.start();
                }
            }

            play(type) {
                if (!this.ctx) return;
                const t = this.ctx.currentTime;
                const masterGain = this.ctx.createGain();
                masterGain.connect(this.ctx.destination);

                switch(type) {
                    case 'inhale':
                        this._createOsc(masterGain, 'sine', 528, t, { duration: 2.0, vol: 0.5, decay: 'exponential', attack: 0.1 });
                        break;
                    case 'exhale':
                        this._createOsc(masterGain, 'sine', 432, t, { duration: 2.0, vol: 0.5, decay: 'exponential', attack: 0.1 });
                        break;
                    case 'action_start':
                        this._createOsc(masterGain, 'sine', 528, t, { duration: 3.0, vol: 0.7, decay: 'exponential' });
                        this._createOsc(masterGain, 'triangle', 1056, t, { duration: 1.5, vol: 0.2, decay: 'exponential' });
                        break;
                    case 'break_start':
                        this._createOsc(masterGain, 'sine', 256, t, { duration: 10.0, vol: 0.8, decay: 'linear' });
                        this._createOsc(masterGain, 'triangle', 512, t, { duration: 8.0, vol: 0.2, decay: 'linear' });
                        break;
                    case 'countdown_tick':
                        this._createOsc(masterGain, 'triangle', 800, t, { duration: 0.1, vol: 0.3, decay: 'exponential' });
                        break;
                    case 'session_end':
                        this._createOsc(masterGain, 'sine', 256.87, t, { duration: 10.0, vol: 0.5, decay: 'linear' });
                        this._createOsc(masterGain, 'sine', 323.83, t, { duration: 10.0, vol: 0.4, decay: 'linear' });
                        this._createOsc(masterGain, 'sine', 384.87, t, { duration: 10.0, vol: 0.4, decay: 'linear' });
                        break;
                }
            }

            _createOsc(node, type, freqStart, startTime, opts) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                
                osc.frequency.setValueAtTime(freqStart, startTime);
                if (opts.frequencyEnd) {
                    osc.frequency.linearRampToValueAtTime(opts.frequencyEnd, startTime + opts.duration);
                }

                const attack = opts.attack || 0.05;
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(opts.vol, startTime + attack);

                if (opts.decay === 'linear') {
                    gain.gain.linearRampToValueAtTime(0.001, startTime + opts.duration);
                } else {
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + opts.duration);
                }

                osc.connect(gain);
                gain.connect(node);
                osc.start(startTime);
                osc.stop(startTime + opts.duration);
            }
        }

        // --- Main Application State & Logic ---
        const app = {
            mode: 'routine',
            state: 'idle',
            audio: new AcousticEngine(),
            
            // Timer tracking
            expectedEndTime: 0,
            nextPhaseTime: 0,
            pauseTimestamp: 0,
            
            // Phase tracking
            isFirstIntervalActive: true,
            activeRunIndex: 0,
            lastTickSecond: -1,
            
            // Flow Data Management 
            flows: [
                {
                    id: 'flow_default',
                    name: 'Regular day start',
                    routine: [
                        { id: 1, name: "Kapalbhati", type: "action", dur: 120 },
                        { id: 2, name: "Integration Break", type: "break", dur: 60 },
                        { id: 3, name: "Bhastrika", type: "action", dur: 120 },
                        { id: 4, name: "Integration Break", type: "break", dur: 60 },
                        { id: 5, name: "Anulom Vilom", type: "action", dur: 300 },
                        { id: 6, name: "Break", type: "break", dur: 60 },
                        { id: 7, name: "Bhramri", type: "action", dur: 300 },
                        { id: 8, name: "Break", type: "break", dur: 60 },
                        { id: 9, name: "Om uchharan", type: "action", dur: 300 },
                        { id: 10, name: "Break", type: "break", dur: 20 },
                        { id: 11, name: "Dhyan", type: "action", dur: 300 },
                        { id: 12, name: "The end", type: "break", dur: 60 }
                    ]
                }
            ],
            currentFlowId: 'flow_default',
            editingId: null,

            // DOM
            ui: {
                mainBtn: document.getElementById('mainActionBtn'),
                resetBtn: document.getElementById('resetBtn'),
                totalTime: document.getElementById('totalTimeDisplay'),
                intervalTime: document.getElementById('intervalTimeDisplay'),
                phaseLabel: document.getElementById('currentPhaseLabel'),
                nextLabel: document.getElementById('nextPhaseLabel'),
                activeContainer: document.getElementById('activePhaseContainer'),
                nextLabelWrapper: document.getElementById('nextPhaseLabelWrapper'),
                settingsContainer: document.getElementById('settingsContainer'),
                topNav: document.getElementById('topNav'),
                menuList: document.getElementById('menuList'),
                topBarTitle: document.getElementById('topBarTitle'),
                sideMenu: document.getElementById('sideMenu'),
                menuBackdrop: document.getElementById('menuBackdrop'),
                appContainer: document.querySelector('.app-container')
            },

            // Stored Classes for Buttons
            classes: {
                btnBegin: "flex-1 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-semibold py-4 px-6 rounded-2xl shadow-[0_8px_25px_rgba(16,185,129,0.3)] transform transition active:scale-95 text-[15px] tracking-[0.2em] uppercase flex items-center justify-center border border-emerald-500/50",
                btnPause: "flex-1 bg-slate-800 hover:bg-slate-700 text-white font-semibold py-4 px-6 rounded-2xl shadow-[0_8px_25px_rgba(0,0,0,0.3)] transform transition active:scale-95 text-[15px] tracking-[0.2em] uppercase flex items-center justify-center border border-slate-700",
                btnResume: "flex-1 bg-amber-600 hover:bg-amber-500 text-white font-semibold py-4 px-6 rounded-2xl shadow-[0_8px_25px_rgba(245,158,11,0.3)] transform transition active:scale-95 text-[15px] tracking-[0.2em] uppercase flex items-center justify-center border border-amber-500/50"
            },

            init() {
                this.bindEvents();
                this.switchMode(this.mode, this.currentFlowId);
                
                worker.onmessage = (e) => {
                    if (e.data === 'tick' && this.state === 'running') this.onTick();
                };

                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible' && this.state === 'running') {
                        this.audio.init();
                        this.onTick();
                    }
                });
            },

            bindEvents() {
                this.ui.mainBtn.addEventListener('click', () => this.handleMainAction());
                this.ui.resetBtn.addEventListener('click', () => this.resetTimer());
                
                ['totalMin', 'totalSec', 'int1', 'int2'].forEach(id => {
                    document.getElementById(id).addEventListener('input', () => {
                        if(this.state === 'idle') this.resetTimer();
                    });
                });
            },

            // --- Menu & Navigation ---
            openMenu() {
                this.ui.menuBackdrop.classList.remove('hidden');
                requestAnimationFrame(() => {
                    this.ui.menuBackdrop.classList.remove('opacity-0');
                    this.ui.sideMenu.classList.remove('-translate-x-full');
                });
            },

            closeMenu() {
                this.ui.sideMenu.classList.add('-translate-x-full');
                this.ui.menuBackdrop.classList.add('opacity-0');
                setTimeout(() => {
                    this.ui.menuBackdrop.classList.add('hidden');
                }, 300);
            },

            renderMenu() {
                this.ui.menuList.innerHTML = '';
                
                const addSectionTitle = (title) => {
                    const el = document.createElement('div');
                    el.className = 'text-[10px] text-slate-500 font-bold tracking-[0.2em] uppercase px-6 py-3 mt-2';
                    el.textContent = title;
                    this.ui.menuList.appendChild(el);
                };

                addSectionTitle('Standard Mode');
                
                const breathBtn = document.createElement('button');
                breathBtn.className = `w-full text-left px-6 py-4 text-sm font-medium tracking-wide transition-colors ${this.mode === 'breathing' ? 'text-emerald-400 bg-slate-800/60 border-l-2 border-emerald-500' : 'text-slate-300 hover:bg-slate-800/40 border-l-2 border-transparent'}`;
                breathBtn.textContent = 'Breathwork Timer';
                breathBtn.onclick = () => {
                    this.switchMode('breathing');
                    this.closeMenu();
                };
                this.ui.menuList.appendChild(breathBtn);
                
                addSectionTitle('Custom Flows');

                this.flows.forEach(flow => {
                    const isActive = this.mode === 'routine' && this.currentFlowId === flow.id;
                    const flowBtn = document.createElement('div');
                    flowBtn.className = `w-full flex items-center justify-between px-6 py-4 transition-colors group cursor-pointer ${isActive ? 'bg-slate-800/60 border-l-2 border-emerald-500' : 'hover:bg-slate-800/40 border-l-2 border-transparent'}`;
                    
                    const textSpan = document.createElement('span');
                    textSpan.className = `text-sm font-medium tracking-wide truncate pr-2 ${isActive ? 'text-emerald-400' : 'text-slate-300'}`;
                    textSpan.textContent = flow.name;
                    textSpan.onclick = () => {
                        this.switchMode('routine', flow.id);
                        this.closeMenu();
                    };
                    flowBtn.appendChild(textSpan);

                    if (this.flows.length > 1) {
                        const deleteBtn = document.createElement('button');
                        deleteBtn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
                        deleteBtn.className = 'text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition p-2 rounded-lg hover:bg-slate-700';
                        deleteBtn.onclick = (e) => {
                            e.stopPropagation();
                            this.deleteFlow(flow.id);
                        };
                        flowBtn.appendChild(deleteBtn);
                    }
                    this.ui.menuList.appendChild(flowBtn);
                });

                const addBtn = document.createElement('button');
                addBtn.className = `w-full text-left px-6 py-4 text-xs font-semibold tracking-widest text-slate-500 hover:text-emerald-400 transition-colors flex items-center space-x-3 uppercase mt-2`;
                addBtn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg><span>Create Flow</span>';
                addBtn.onclick = () => {
                    this.addFlow();
                    this.closeMenu();
                };
                this.ui.menuList.appendChild(addBtn);
            },

            switchMode(newMode, flowId = null) {
                if (this.state !== 'idle') this.resetTimer();
                this.mode = newMode;
                if (flowId) this.currentFlowId = flowId;
                
                document.getElementById('breathingSettings').classList.toggle('hidden', newMode !== 'breathing');
                document.getElementById('routineSettings').classList.toggle('hidden', newMode !== 'routine');
                
                if (newMode === 'routine') {
                    const currentFlow = this.flows.find(f => f.id === this.currentFlowId);
                    document.getElementById('flowNameInput').value = currentFlow.name;
                    this.ui.topBarTitle.textContent = "ROUTINE";
                    this.renderRoutineList();
                } else {
                    this.ui.topBarTitle.textContent = 'BREATHWORK';
                }
                
                this.renderMenu();
                this.resetTimer();
            },

            addFlow() {
                const newId = 'flow_' + Date.now();
                this.flows.push({
                    id: newId,
                    name: 'New Flow',
                    routine: []
                });
                this.switchMode('routine', newId);
            },

            deleteFlow(id) {
                if (this.flows.length <= 1) return; 
                this.flows = this.flows.filter(f => f.id !== id);
                if (this.currentFlowId === id) {
                    this.switchMode('routine', this.flows[0].id);
                } else {
                    this.renderMenu();
                }
            },

            updateFlowName(newName) {
                const flow = this.flows.find(f => f.id === this.currentFlowId);
                if (flow) {
                    flow.name = newName || 'Unnamed Flow';
                    this.renderMenu();
                }
            },

            getCurrentRoutine() {
                const flow = this.flows.find(f => f.id === this.currentFlowId);
                return flow ? flow.routine : [];
            },

            // --- Routine Editor Logic ---
            renderRoutineList() {
                const list = document.getElementById('routineList');
                list.innerHTML = '';
                let totalSecs = 0;
                
                const routine = this.getCurrentRoutine();

                routine.forEach((step, index) => {
                    totalSecs += step.dur;
                    const mins = Math.floor(step.dur / 60);
                    const secs = (step.dur % 60).toString().padStart(2, '0');
                    const isBreak = step.type === 'break';
                    
                    const el = document.createElement('div');
                    // Improved card layout for steps
                    el.className = `flex justify-between items-center p-4 rounded-2xl border transition-all duration-200 group ${isBreak ? 'bg-slate-900/40 border-slate-800/50' : 'bg-slate-800/40 border-slate-700/60'} hover:border-emerald-500/40`;
                    el.id = `routine-step-${index}`;
                    
                    el.innerHTML = `
                        <div class="flex items-center space-x-4">
                            <button onclick="app.startTimer(${index})" class="text-slate-400 hover:text-emerald-400 p-2 rounded-full hover:bg-slate-800 transition transform active:scale-95" title="Play from here">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                            <span class="text-sm font-medium cursor-pointer ${isBreak ? 'text-amber-100/70' : 'text-slate-200'} group-hover:text-emerald-300 transition-colors" onclick="app.openEditModal(${step.id})" title="Edit Step">${step.name}</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-xs font-mono ${isBreak ? 'text-amber-400/70' : 'text-emerald-400/70'}">${mins}:${secs}</span>
                            <button onclick="app.deleteRoutineStep(${step.id})" class="text-slate-600 hover:text-red-400 transition p-2 rounded-xl hover:bg-slate-800 opacity-0 group-hover:opacity-100">
                                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    `;
                    list.appendChild(el);
                });

                if (this.mode === 'routine' && this.state === 'idle') {
                    this.ui.totalTime.textContent = this.formatTime(totalSecs * 1000);
                }
            },

            addRoutineStep() {
                const routine = this.getCurrentRoutine();
                const newId = routine.length > 0 ? Math.max(...routine.map(s => s.id)) + 1 : 1;
                routine.push({ id: newId, name: "New Step", type: "action", dur: 60 });
                this.renderRoutineList();
                this.openEditModal(newId);
            },

            deleteRoutineStep(id) {
                const flow = this.flows.find(f => f.id === this.currentFlowId);
                if (flow) {
                    flow.routine = flow.routine.filter(s => s.id !== id);
                    this.renderRoutineList();
                }
            },

            openEditModal(id) {
                this.editingId = id;
                const routine = this.getCurrentRoutine();
                const step = routine.find(s => s.id === id);
                if(!step) return;

                document.getElementById('editName').value = step.name;
                document.querySelector(`input[name="editType"][value="${step.type}"]`).checked = true;
                document.getElementById('editMin').value = Math.floor(step.dur / 60);
                document.getElementById('editSec').value = step.dur % 60;
                
                document.getElementById('editModal').classList.remove('hidden');
            },

            closeEditModal() {
                document.getElementById('editModal').classList.add('hidden');
                this.editingId = null;
            },

            saveEditModal() {
                if(!this.editingId) return;
                const routine = this.getCurrentRoutine();
                const step = routine.find(s => s.id === this.editingId);
                
                if (step) {
                    step.name = document.getElementById('editName').value || "Unnamed";
                    step.type = document.querySelector('input[name="editType"]:checked').value;
                    
                    const m = parseInt(document.getElementById('editMin').value) || 0;
                    const s = parseInt(document.getElementById('editSec').value) || 0;
                    step.dur = Math.max(1, (m * 60) + s);
                }

                this.closeEditModal();
                this.renderRoutineList();
                if(this.state === 'idle') this.resetTimer();
            },

            // --- Import / Export ---
            exportRoutine() {
                try {
                    const dataStr = JSON.stringify(this.flows, null, 2);
                    const blob = new Blob([dataStr], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `zenith_flows.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    this.closeMenu();
                } catch (e) {
                    alert("Error exporting routines.");
                }
            },

            importRoutine(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (Array.isArray(imported) && imported.length > 0 && imported[0].hasOwnProperty('routine')) {
                            this.flows = imported;
                            this.currentFlowId = this.flows[0].id;
                            this.switchMode('routine', this.currentFlowId);
                            this.closeMenu();
                        } else {
                            alert("Invalid flows file format.");
                        }
                    } catch (err) {
                        alert("Error parsing file.");
                    }
                    event.target.value = ''; 
                };
                reader.readAsText(file);
            },

            // --- Timer Core Logic ---
            handleMainAction() {
                if (this.state === 'idle') {
                    this.startTimer(0);
                } else if (this.state === 'running') {
                    this.pauseTimer();
                } else if (this.state === 'paused') {
                    this.resumeTimer();
                }
            },

            startTimer(startIndex = 0) {
                this.audio.init();
                document.getElementById('silentAudio').play().catch(()=>{});
                
                try {
                    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(e=>{});
                } catch(e) {}

                const now = Date.now();
                this.lastTickSecond = -1;

                if (this.mode === 'breathing') {
                    const m = parseInt(document.getElementById('totalMin').value) || 0;
                    const s = parseInt(document.getElementById('totalSec').value) || 0;
                    const totalMs = (m * 60 + s) * 1000;
                    if (totalMs <= 0) return alert("Please enter a total duration.");

                    this.expectedEndTime = now + totalMs;
                    this.isFirstIntervalActive = true;
                    
                    const int1 = (parseFloat(document.getElementById('int1').value) || 4) * 1000;
                    this.nextPhaseTime = now + int1;
                    
                    this.updatePhaseUI("Inhale", "action");
                    this.audio.play('inhale');

                } else {
                    const routine = this.getCurrentRoutine();
                    if (routine.length === 0) return alert("Please add at least one step.");
                    if (startIndex >= routine.length) return;
                    
                    this.activeRunIndex = startIndex;
                    
                    let remainingDurSec = 0;
                    for (let i = this.activeRunIndex; i < routine.length; i++) {
                        remainingDurSec += routine[i].dur;
                    }
                    
                    this.expectedEndTime = now + (remainingDurSec * 1000);
                    
                    const firstStep = routine[this.activeRunIndex];
                    this.nextPhaseTime = now + (firstStep.dur * 1000);
                    
                    this.updatePhaseUI(firstStep.name, firstStep.type, routine[this.activeRunIndex + 1]?.name);
                    this.highlightRoutineStep(this.activeRunIndex);
                    this.audio.play(firstStep.type === 'break' ? 'break_start' : 'action_start');
                }

                this.setRunningState();
            },

            pauseTimer() {
                this.state = 'paused';
                worker.postMessage('stop');
                this.pauseTimestamp = Date.now();
                
                this.ui.mainBtn.textContent = 'RESUME';
                this.ui.mainBtn.className = this.classes.btnResume;
                
                this.ui.activeContainer.classList.remove('pulse-ring');
                this.ui.phaseLabel.textContent = "PAUSED";
                this.ui.phaseLabel.className = "text-slate-400 text-sm font-medium tracking-[0.15em] uppercase mb-2 h-6 flex items-center justify-center transition-colors";
            },

            resumeTimer() {
                this.audio.init(); 
                
                const pauseDuration = Date.now() - this.pauseTimestamp;
                this.expectedEndTime += pauseDuration;
                this.nextPhaseTime += pauseDuration;
                
                this.setRunningState();
            },

            setRunningState() {
                this.state = 'running';
                worker.postMessage('start');
                
                this.ui.mainBtn.textContent = 'PAUSE';
                this.ui.mainBtn.className = this.classes.btnPause;
                
                // Show timer elements
                this.ui.phaseLabel.classList.remove('hidden');
                this.ui.intervalTime.classList.remove('hidden');
                this.ui.nextLabelWrapper.classList.remove('hidden');
                
                // Restore container padding for running state
                this.ui.activeContainer.classList.remove('py-2', 'mb-2', 'mt-1');
                this.ui.activeContainer.classList.add('py-6', 'mb-4', 'mt-2');
                
                // Enlarge timer display
                this.ui.intervalTime.classList.remove('text-[60px]', 'sm:text-[80px]', 'h-[120px]');
                this.ui.intervalTime.classList.add('text-[120px]', 'sm:text-[180px]', 'h-[200px]');
                
                // Trigger Focus Mode
                this.ui.settingsContainer.classList.add('focus-hidden');
                this.ui.topNav.classList.add('focus-hidden');
                
                // Expand Timer vertically slightly
                this.ui.activeContainer.classList.add('flex-1');
            },

            resetTimer() {
                this.state = 'idle';
                worker.postMessage('stop');
                document.getElementById('silentAudio').pause();
                
                this.ui.mainBtn.textContent = 'START SESSION';
                this.ui.mainBtn.className = this.classes.btnBegin;
                
                // Shrink timer display back to idle size
                this.ui.intervalTime.classList.remove('text-[120px]', 'sm:text-[180px]', 'h-[200px]');
                this.ui.intervalTime.classList.add('text-[60px]', 'sm:text-[80px]', 'h-[120px]');
                
                // Hide timer elements in idle state (only show session pill)
                this.ui.phaseLabel.classList.add('hidden');
                this.ui.intervalTime.classList.add('hidden');
                this.ui.nextLabelWrapper.classList.add('hidden');
                
                // Reduce container padding for idle state
                this.ui.activeContainer.classList.remove('py-6', 'mb-4', 'mt-2');
                this.ui.activeContainer.classList.add('py-2', 'mb-2', 'mt-1');
                
                // Exit Focus Mode
                this.ui.settingsContainer.classList.remove('focus-hidden');
                this.ui.topNav.classList.remove('focus-hidden');
                this.ui.activeContainer.classList.remove('flex-1');
                
                this.ui.appContainer.style.backgroundColor = '#0f172a'; // Reset to Slate
                this.ui.activeContainer.classList.remove('pulse-ring');
                this.ui.phaseLabel.textContent = "READY";
                this.ui.phaseLabel.className = "text-slate-400 text-sm font-medium tracking-[0.15em] uppercase mb-2 h-6 flex items-center justify-center transition-colors hidden";
                this.ui.intervalTime.textContent = "0";
                this.ui.nextLabel.classList.add('hidden');
                
                this.highlightRoutineStep(-1);

                if (this.mode === 'breathing') {
                    const m = parseInt(document.getElementById('totalMin').value) || 0;
                    const s = parseInt(document.getElementById('totalSec').value) || 0;
                    this.ui.totalTime.textContent = this.formatTime((m * 60 + s) * 1000);
                } else {
                    const routine = this.getCurrentRoutine();
                    const totalDur = routine.reduce((acc, step) => acc + step.dur, 0);
                    this.ui.totalTime.textContent = this.formatTime(totalDur * 1000);
                }
            },

            endSession() {
                this.resetTimer();
                // Show phase label and timer for the completion message
                this.ui.phaseLabel.classList.remove('hidden');
                this.ui.intervalTime.classList.remove('hidden');
                this.ui.phaseLabel.textContent = "COMPLETE";
                this.ui.phaseLabel.className = "text-emerald-400 text-sm font-bold tracking-[0.2em] uppercase mb-2 h-6 flex items-center justify-center transition-colors";
                this.ui.intervalTime.textContent = "DONE";
                // Restore some padding for visibility
                this.ui.activeContainer.classList.remove('py-2', 'mb-2', 'mt-1');
                this.ui.activeContainer.classList.add('py-6', 'mb-4', 'mt-2');
                this.audio.play('session_end'); 
            },

            onTick() {
                const now = Date.now();

                if (now >= this.expectedEndTime) {
                    this.endSession();
                    return;
                }

                const phaseRemainingMs = this.nextPhaseTime - now;
                const phaseRemainingSecs = Math.ceil(phaseRemainingMs / 1000);

                if (this.mode === 'routine' && phaseRemainingSecs <= 5 && phaseRemainingSecs > 0) {
                    const routine = this.getCurrentRoutine();
                    const currentStep = routine[this.activeRunIndex];
                    if (currentStep && currentStep.type === 'break' && this.lastTickSecond !== phaseRemainingSecs) {
                        this.audio.play('countdown_tick');
                        this.lastTickSecond = phaseRemainingSecs;
                    }
                }

                if (now >= this.nextPhaseTime) {
                    this.transitionPhase(now);
                }

                this.ui.totalTime.textContent = this.formatTime(this.expectedEndTime - now);
                this.ui.intervalTime.textContent = Math.max(0, Math.ceil((this.nextPhaseTime - now) / 1000));
            },

            transitionPhase(now) {
                if (this.mode === 'breathing') {
                    this.isFirstIntervalActive = !this.isFirstIntervalActive;
                    
                    const nextType = this.isFirstIntervalActive ? 'inhale' : 'exhale';
                    const dur = parseFloat(document.getElementById(this.isFirstIntervalActive ? 'int1' : 'int2').value) || 4;
                    
                    this.nextPhaseTime += (dur * 1000);
                    this.updatePhaseUI(nextType === 'inhale' ? 'Inhale' : 'Exhale', 'action');
                    this.audio.play(nextType);
                    
                } else {
                    this.activeRunIndex++;
                    const routine = this.getCurrentRoutine();
                    
                    if (this.activeRunIndex < routine.length) {
                        const step = routine[this.activeRunIndex];
                        this.nextPhaseTime += (step.dur * 1000);
                        
                        this.updatePhaseUI(step.name, step.type, routine[this.activeRunIndex + 1]?.name);
                        this.highlightRoutineStep(this.activeRunIndex);
                        
                        this.audio.play(step.type === 'break' ? 'break_start' : 'action_start');
                    } else {
                        this.endSession(); 
                    }
                }
            },

            updatePhaseUI(name, type, nextName = null) {
                this.ui.phaseLabel.textContent = name;
                
                if (type === 'action') {
                    this.ui.phaseLabel.className = "text-emerald-400 text-sm font-bold tracking-[0.15em] uppercase mb-2 h-6 flex items-center justify-center transition-colors drop-shadow-[0_0_10px_rgba(16,185,129,0.8)]";
                    this.ui.activeContainer.classList.add('pulse-ring');
                    this.ui.appContainer.style.backgroundColor = '#064e3b'; // Deep Green for Action
                } else {
                    this.ui.phaseLabel.className = "text-amber-400 text-sm font-bold tracking-[0.15em] uppercase mb-2 h-6 flex items-center justify-center transition-colors";
                    this.ui.activeContainer.classList.remove('pulse-ring');
                    this.ui.appContainer.style.backgroundColor = '#78350f'; // Deep Yellow/Amber for Break
                }

                if (nextName) {
                    this.ui.nextLabel.textContent = `Up Next: ${nextName}`;
                    this.ui.nextLabel.classList.remove('hidden');
                } else {
                    this.ui.nextLabel.classList.add('hidden');
                }
            },

            highlightRoutineStep(idx) {
                // Highlighting in the list is mostly invisible during run due to focus mode,
                // but keeps state correct when paused/resumed
                document.querySelectorAll('#routineList > div').forEach((el, i) => {
                    if (i === idx) {
                        el.classList.replace('border-slate-700/60', 'border-emerald-500/80');
                        el.classList.replace('border-slate-800/50', 'border-amber-500/80');
                    } else {
                        el.classList.replace('border-emerald-500/80', 'border-slate-700/60');
                        el.classList.replace('border-amber-500/80', 'border-slate-800/50');
                    }
                });
            },

            formatTime(ms) {
                if (ms < 0) ms = 0;
                const totalSecs = Math.ceil(ms / 1000);
                const m = Math.floor(totalSecs / 60).toString().padStart(2, '0');
                const s = (totalSecs % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            }
        };

        app.init();

    </script>
</body>
